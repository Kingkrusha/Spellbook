name: Build release binaries

# Builds Windows and macOS binaries and attaches them to a GitHub Release,
# together with a SHA256SUMS file the in-app updater uses to verify downloads.
#
# Trigger by pushing a version tag:
#     git tag v1.5.4
#     git push origin v1.5.4
#
# Or run it by hand from the Actions tab (workflow_dispatch) to get build
# artifacts without cutting a release.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            spec: main.spec
            artifact: dist/spellbook.exe
            asset: Spellbook-windows-x64.exe
          - os: macos-14          # Apple Silicon
            name: macos-arm64
            build: ./build_mac.sh
            asset: dist/Spellbook-macos-arm64.zip
          - os: macos-13          # Intel
            name: macos-x86_64
            build: ./build_mac.sh
            asset: dist/Spellbook-macos-x86_64.zip
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      # ---------- Windows ----------
      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: pyinstaller ${{ matrix.spec }} --noconfirm

      - name: Stage Windows asset
        if: runner.os == 'Windows'
        shell: bash
        run: cp "${{ matrix.artifact }}" "${{ matrix.asset }}"

      # ---------- macOS ----------
      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          chmod +x build_mac.sh
          ./build_mac.sh --clean

      # ---------- Upload ----------
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Spellbook-${{ matrix.name }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}
          fail_on_unmatched_files: true
          body: |
            ### Downloads
            - **Windows:** `Spellbook-windows-x64.exe` - download and run.
            - **macOS (Apple Silicon):** `Spellbook-macos-arm64.zip`
            - **macOS (Intel):** `Spellbook-macos-x86_64.zip`

            `SHA256SUMS` lists the checksum of each file; the in-app updater
            checks downloads against it.

            **macOS first launch:** the app is not notarized, so right-click
            (or Control-click) `Spellbook.app` and choose **Open**, then confirm
            once. After that it opens normally. See the README for details.

  # Collect the three binaries built above, hash them into one SHA256SUMS file,
  # and attach it to the same release. Runs only for tag pushes (real releases).
  checksums:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA256SUMS
        run: |
          cd dist
          sha256sum \
            Spellbook-windows-x64.exe \
            Spellbook-macos-arm64.zip \
            Spellbook-macos-x86_64.zip > SHA256SUMS
          echo "----- SHA256SUMS -----"
          cat SHA256SUMS

      - name: Attach SHA256SUMS to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SHA256SUMS
          fail_on_unmatched_files: true
